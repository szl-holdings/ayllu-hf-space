[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ayllu-hf-space"
version = "0.1.0"
description = "HF Space bind target for Ayllu Counsel. Canonical source remains szl-holdings/ayllu."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/szl-holdings/ayllu"
Repository = "https://github.com/szl-holdings/ayllu-hf-space"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
